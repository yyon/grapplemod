configurations.all {
    resolutionStrategy.cacheDynamicVersionsFor(1, "seconds")
}

def legacy = nyfs.versions.era.get() == "legacy"
def accessTransformer = project(":common").file('src/main/resources/META-INF/accesstransformer.cfg')

if (legacy) {
    mixin {
        add(sourceSets.main, "${mod_id}.refmap.json")
        config("${mod_id}.mixins.json")
    }

    legacyForge {
        version = nyfs.versions.minecraft.get() + "-" + nyfs.versions.forgeVersion.get()
        if (accessTransformer.exists()) {
            accessTransformers = [accessTransformer]
        }
        parchment {
            minecraftVersion = nyfs.versions.parchmentMinecraft.get()
            mappingsVersion = nyfs.versions.parchmentVersion.get()
        }
        mods {
            "${mod_id}" {
                sourceSet sourceSets.main
            }
        }
        runs {
            configureEach {
                jvmArguments = ['-XX:+AllowEnhancedClassRedefinition']
            }
            client {
                client()
            }
            server {
                server()
            }
        }
    }

    dependencies {
        annotationProcessor(nyfs.mixin) {
            artifact {
                classifier = 'processor'
            }
        }
    }

    jar {
        finalizedBy('reobfJar')
        manifest.attributes([
                "MixinConfigs": "${mod_id}.mixins.json"
        ])
    }
} else {
    neoForge {
        version = nyfs.versions.neoforgeVersion.get()
        if (accessTransformer.exists()) {
            accessTransformers = [accessTransformer]
        }
        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
        runs {
            client {
                client()
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }
            server {
                server()
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
                programArgument '--nogui'
            }
        }
    }
}
