pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.100media.dev/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
    id 'com.nyfaria.moddingtools' version '1.1.9'
}

nyfsModdingTools {
    clearCache=false
}

rootProject.name = "grapplemod"
include("common")
include("fabric")
include("neoforge")
